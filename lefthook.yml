pre-commit:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: lint
      glob: "*.{ts,tsx,css,json}"
      run: pnpm biome lint --no-errors-on-unmatched {staged_files}

pre-push:
  parallel: true
  jobs:
    - name: test
      run: pnpm test
    - name: build
      run: pnpm build
    # Sauvegarde privée (code + prompts.local, rules.local…) vers le remote `private`, s'il existe. Ne bloque jamais le push.
    - name: private
      run: pnpm -s private:push --if-configured
